# Include these locations INSIDE the existing HTTPS server { ... } for anatolii-botov.ru.
# Keep the existing Certbot ssl_certificate / ssl_certificate_key settings.
location = /admin {
    return 301 /admin/;
}

location /admin/ {
    proxy_pass http://127.0.0.1:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
}
